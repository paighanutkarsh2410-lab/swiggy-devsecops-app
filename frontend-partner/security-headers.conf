# Security headers for the console's own pages and files, included by each
# location in nginx.conf. API responses come from the backend, which sets
# its own security headers (helmet).
#
# Content Security Policy: scripts, styles, fonts, images and API calls
# (including the live order stream) may only come from this site, nothing
# may embed it, and plugins, <base> tags and form posts to other sites are
# blocked. Fonts are bundled with the site for this reason.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Isolate the console from other origins' windows and resources.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# The console is only for signed-in restaurant staff; keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
