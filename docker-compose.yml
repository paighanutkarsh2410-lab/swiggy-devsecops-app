services:
  postgres:
    image: postgres:16
    container_name: swiggy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: swiggy_db
      POSTGRES_USER: swiggy_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiggy_app -d swiggy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - swiggy-network

  backend:
    build:
      context: ./backend

    container_name: swiggy-backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: swiggy_db
      DB_USER: swiggy_app
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - swiggy-network

networks:
  swiggy-network:
    driver: bridge

volumes:
  postgres_data:
