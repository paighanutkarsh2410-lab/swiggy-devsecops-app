services:
  postgres:
    image: postgres:16
    container_name: swiggy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: swiggy_db
      POSTGRES_USER: swiggy_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiggy_app -d swiggy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - swiggy-network

  backend:
    build:
      context: ./backend

    container_name: swiggy-backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: swiggy_db
      DB_USER: swiggy_app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      swiggy-network:
        # Nginx looks up the backend address once at startup, so the
        # backend keeps the same address when its container is recreated.
        ipv4_address: 172.28.0.10

  frontend:
    build:
      context: ./frontend
    image: swiggy-frontend:1.0.0
    container_name: swiggy-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - swiggy-network

  # Restaurant partner console. A separate site from the customer app,
  # sharing the same backend API.
  partner:
    build:
      context: ./frontend-partner
    image: swiggy-partner:1.0.0
    container_name: swiggy-partner
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - swiggy-network

networks:
  swiggy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
