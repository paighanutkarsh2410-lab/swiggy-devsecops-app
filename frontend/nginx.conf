server {
    listen 8080;
    server_name _;
    # "Server: nginx" without the version number.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx only applies a location's own add_header lines, so each location
    # that serves the site includes the security headers itself.

    # Build files have a content hash in their names and never change, so
    # browsers may keep them for a year.
    location /assets/ {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is checked again on every visit, so a new deploy is picked up.
    location / {
        include security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
