name: Swiggy DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Backend Tests and Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swiggy_db
          POSTGRES_USER: swiggy_app
          POSTGRES_PASSWORD: swiggy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiggy_app -d swiggy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: swiggy_db
      DB_USER: swiggy_app
      DB_PASSWORD: swiggy_test_password
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Initialize test database
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f backend/db/init.sql

      - name: Run backend API tests
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend for production
        run: npm run build --prefix frontend

      - name: Install partner console dependencies
        run: npm ci --prefix frontend-partner

      - name: Lint partner console
        run: npm run lint --prefix frontend-partner

      - name: Build partner console for production
        run: npm run build --prefix frontend-partner

  container-security:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
        contents: read
        packages: write
    env:
      BACKEND_IMAGE: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-backend
      FRONTEND_IMAGE: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-frontend
      PARTNER_IMAGE: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-partner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build \
            -t "$BACKEND_IMAGE:$GITHUB_SHA" \
            -t "$BACKEND_IMAGE:latest" \
            -f backend/Dockerfile backend

      - name: Build frontend image
        run: |
          docker build \
            -t "$FRONTEND_IMAGE:$GITHUB_SHA" \
            -t "$FRONTEND_IMAGE:latest" \
            -f frontend/Dockerfile frontend

      - name: Build partner console image
        run: |
          docker build \
            -t "$PARTNER_IMAGE:$GITHUB_SHA" \
            -t "$PARTNER_IMAGE:latest" \
            -f frontend-partner/Dockerfile frontend-partner

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-backend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Scan partner console image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-partner:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$BACKEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$PARTNER_IMAGE:$GITHUB_SHA"
          docker push "$PARTNER_IMAGE:latest"

  propose-deploy:
    name: Propose Deployment to Infra Repo
    runs-on: ubuntu-latest
    needs: container-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      # Fine-grained token with Contents and Pull requests write access to
      # swiggy-devsecops-infra only. Without it this job does nothing.
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}

    steps:
      - name: Check for the infra repo token
        id: token
        run: |
          if [ -z "$INFRA_REPO_TOKEN" ]; then
            echo "::notice::INFRA_REPO_TOKEN is not set, so no deployment pull request is opened."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout the infra repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: paighanutkarsh2410-lab/swiggy-devsecops-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Open a pull request that deploys this commit
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: bash app/.github/scripts/propose-infra-deploy.sh infra "$GITHUB_SHA"
